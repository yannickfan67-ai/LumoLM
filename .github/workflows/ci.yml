name: Train and inference smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Train a tiny model
        run: |
          python -m lumolm.train --data data/demo.txt --checkpoint checkpoints/demo.pt --device cpu --steps 2 --batch-size 2 --block-size 16 --n-layer 1 --n-head 2 --n-embd 32 --eval-iters 1 --eval-interval 1
      - name: Run inference
        run: python -m lumolm.generate --checkpoint checkpoints/demo.pt --prompt 'Hello' --max-new-tokens 12 --device cpu --temperature 0
      - name: Train conversation examples for reproducible quality diagnostics (not pretrained)
        env:
          OMP_NUM_THREADS: "2"
        run: |
          python -m lumolm.train --data data/dialogue_demo.txt --checkpoint checkpoints/probe.pt --device cpu --steps 1000 --batch-size 8 --block-size 128 --n-layer 2 --n-head 2 --n-embd 64 --lr 0.001 --eval-interval 500 --eval-iters 4
      - name: Speak with the trained diagnostic model
        run: PYTHONPATH=. python scripts/probe_chat.py --checkpoint checkpoints/probe.pt --max-new-tokens 60 --device cpu
      - name: Speak using interactive chat adapter
        run: |
          python -m lumolm.chat --checkpoint checkpoints/probe.pt --question 'What is LumoLM?' --device cpu --max-new-tokens 90
          python -m lumolm.chat --checkpoint checkpoints/probe.pt --question '你好嗎？' --device cpu --max-new-tokens 90
      - name: Upload demonstration dialogue checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: lumolm-dialogue-checkpoint
          path: checkpoints/probe.pt
          if-no-files-found: error
          retention-days: 7
