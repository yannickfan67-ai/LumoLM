name: Train LumoLM (manual CPU)
on:
  workflow_dispatch:
    inputs:
      corpus:
        description: 'UTF-8 text file already committed in the repository'
        type: string
        default: 'data/demo.txt'
        required: true
      steps:
        description: 'Total training steps (1-2000 on shared CPU runner)'
        type: number
        default: 300
        required: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train
        env:
          STEPS: ${{ inputs.steps }}
          CORPUS: ${{ inputs.corpus }}
        run: |
          if ! [[ "$STEPS" =~ ^[0-9]+$ ]] || (( STEPS < 1 || STEPS > 2000 )); then
            echo 'steps must be an integer from 1 to 2000' >&2
            exit 1
          fi
          if [[ ! -f "$CORPUS" ]]; then
            echo 'corpus must name a file checked into this repository' >&2
            exit 1
          fi
          python -m lumolm.train --data "$CORPUS" --checkpoint checkpoints/manual.pt --device cpu --steps "$STEPS" --batch-size 8 --block-size 32 --n-layer 2 --n-head 2 --n-embd 64 --eval-interval 100 --eval-iters 5
      - name: Inference check
        run: python -m lumolm.generate --checkpoint checkpoints/manual.pt --prompt 'Question:' --max-new-tokens 80 --temperature 0
      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: lumolm-cpu-checkpoint
          path: checkpoints/manual.pt
          if-no-files-found: error
          retention-days: 14
